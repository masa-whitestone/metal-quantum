name: Secure Documentation Build

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'metalq/**'
      - '.github/workflows/docs-secure.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'metalq/**'
      - '.github/workflows/docs-secure.yml'
  workflow_dispatch:

# Security: Minimal permissions by default
permissions:
  contents: read

jobs:
  validate:
    name: Validate Documentation Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Prevent injection attacks via git config
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # Use specific Python version for reproducibility

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Validate MkDocs configuration
        run: |
          python docs/secure_build.py --validate-only

      - name: Check for security issues
        run: |
          # Check for suspicious patterns in docs
          echo "Checking for suspicious patterns..."

          # Check for absolute paths
          if grep -r "^/" docs/ --include="*.md" 2>/dev/null; then
            echo "Warning: Absolute paths found in documentation"
          fi

          # Check for environment variable expansion
          if grep -r "\${.*}" docs/ --include="*.md" 2>/dev/null; then
            echo "Warning: Variable expansion patterns found"
          fi

          # Check for dangerous HTML
          if grep -r "<script" docs/ --include="*.md" 2>/dev/null; then
            echo "Error: Script tags found in documentation"
            exit 1
          fi

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: docs_security_audit.log
          retention-days: 30

  build-sandbox:
    name: Build Documentation (Sandboxed)
    runs-on: ubuntu-latest
    needs: validate

    # Run in container for additional isolation. Container options must be a
    # single line: a multi-line value is passed to `docker create` with
    # embedded newlines and fails with "invalid reference format".
    # /tmp allows exec because secure_build.py creates and runs a venv there
    # (rootfs stays read-only, nosuid, non-root user).
    # The uid MUST be 1001 (the hosted-runner user): the runner mounts
    # host-owned dirs (e.g. _runner_file_commands) into the container, and
    # any other uid fails their writes with EACCES.
    container:
      image: python:3.11-slim
      options: >-
        --user 1001:1001
        --read-only
        --tmpfs /tmp:rw,exec,nosuid,size=1024M
        --tmpfs /home:rw,noexec,nosuid,size=256M

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Show build user
        run: |
          # Running as non-root user (set by container options)
          id
          pwd

      - name: Install build dependencies
        run: |
          # secure_build.py needs only pyyaml itself; it creates its own
          # sandbox venv and installs the pinned mkdocs toolchain inside it.
          python -m pip install --user --no-cache-dir pyyaml

      - name: Run sandboxed build
        run: |
          # Set restrictive environment
          export PYTHONDONTWRITEBYTECODE=1
          export PYTHONPATH=""

          # Clear dangerous environment variables
          unset LD_PRELOAD
          unset LD_LIBRARY_PATH

          # Run build with timeout
          timeout 600 python docs/secure_build.py --output /tmp/site

      - name: Verify build output
        run: |
          # Check that output was created
          if [ ! -d "/tmp/site" ]; then
            echo "Error: Documentation was not built"
            exit 1
          fi

          # Check for suspicious content in output
          echo "Checking output for security issues..."

          # No PHP files should be in output
          if find /tmp/site -name "*.php" -o -name "*.sh" | grep -q .; then
            echo "Error: Executable files found in output"
            exit 1
          fi

          # Check file permissions
          find /tmp/site -type f -perm /111 -exec echo "Warning: Executable file {}" \;

      - name: Upload built documentation
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: /tmp/site
          retention-days: 30

  # NOTE: no deploy job here on purpose. Deployment is owned by docs.yml
  # (mkdocs gh-deploy -> gh-pages branch); a second deployment path via
  # actions/deploy-pages requires the incompatible "GitHub Actions" Pages
  # source and the two methods race each other. This workflow validates and
  # builds in a sandbox as a CI check only.
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-sandbox

    steps:
      - name: Download documentation
        uses: actions/download-artifact@v4
        with:
          name: documentation
          path: ./site

      - name: Run security scanner
        run: |
          # Scan for common vulnerabilities
          echo "Scanning for security vulnerabilities..."

          # Check for XSS vulnerabilities
          if grep -r "javascript:" ./site --include="*.html" 2>/dev/null; then
            echo "Warning: Potential XSS vector found (javascript: protocol)"
          fi

          # Check for data URIs that could be malicious
          if grep -r "data:text/html" ./site --include="*.html" 2>/dev/null; then
            echo "Warning: Potentially dangerous data URI found"
          fi

          # Check CSP headers recommendation
          echo "Recommendation: Configure Content Security Policy headers for deployed site"

      - name: Generate security report
        run: |
          # Create security scan report
          cat > security_report.txt << EOF
          Documentation Security Scan Report
          ==================================

          Build Date: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          Commit: ${{ github.sha }}

          Checks Performed:
          - Configuration validation
          - Path traversal prevention
          - XSS vulnerability scanning
          - Sensitive data detection
          - File permission verification

          Status: PASSED

          Recommendations:
          - Enable CSP headers on hosting platform
          - Regularly update dependencies
          - Monitor for security advisories
          EOF

      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: security_report.txt
          retention-days: 90