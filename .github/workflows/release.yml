name: Release

# Pushing a tag vX.Y.Z, or running this workflow by hand on main, builds the
# sdist and wheel on Apple Silicon (the wheel carries the compiled
# libmetalq.dylib and default.metallib), checks the built wheel end to end,
# and publishes to PyPI with Trusted Publishing (OIDC). No PyPI API token is
# stored in the repository.
#
# One-time PyPI setup: project metalq -> Manage -> Publishing -> GitHub
# publisher with owner masa-whitestone, repository metal-quantum, workflow
# release.yml, environment pypi.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and check (Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Metal toolchain
        run: |
          xcodebuild -version
          if ! xcrun -sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
            xcrun -sdk macosx metal --version
          fi

      - name: Release ref and version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "event=$GITHUB_EVENT_NAME ref=$GITHUB_REF version=$version"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            test "v$version" = "$GITHUB_REF_NAME"
          else
            test "$GITHUB_REF" = "refs/heads/main"
          fi
          status=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/metalq/$version/json")
          echo "PyPI metalq $version: HTTP $status"
          test "$status" = "404"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*
          ls -l dist

      - name: Inspect the wheel
        run: |
          python - <<'PY'
          import glob, zipfile
          wheels = glob.glob("dist/*.whl")
          assert len(wheels) == 1, wheels
          z = zipfile.ZipFile(wheels[0])
          names = set(z.namelist())
          for name in ("metalq/lib/libmetalq.dylib", "metalq/lib/default.metallib",
                       "metalq/backends/mps/backend.py"):
              assert name in names, f"missing from wheel: {name}"
          backend = z.read("metalq/backends/mps/backend.py").decode()
          assert 'abspath(f"native/build' not in backend, "old CWD loader in wheel"
          assert "METALQ_NATIVE_LIB" in backend, "fixed loader missing from wheel"
          assert b"native/build" not in z.read("metalq/lib/libmetalq.dylib"), \
              "dylib still has CWD-relative metallib paths"
          print("wheel contents ok:", wheels[0])
          PY

      - name: Test the installed wheel from an untrusted directory
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/venv/bin/python" -m pip install dist/*.whl pytest
          mkdir -p "$RUNNER_TEMP/check"
          cp tests/test_native_lib_search_path.py "$RUNNER_TEMP/check/"
          cd "$RUNNER_TEMP/check"
          out=$("$RUNNER_TEMP/venv/bin/python" -m pytest -p no:cacheprovider -rs test_native_lib_search_path.py 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          if grep -q SKIPPED <<<"$out"; then echo "a test was skipped"; exit 1; fi
          "$RUNNER_TEMP/venv/bin/python" - <<'PY'
          import numpy as np
          import metalq
          from metalq import Circuit
          from metalq.backends.mps.backend import MPSBackend
          from metalq.backends.cpu.backend import CPUBackend
          print("metalq", metalq.__version__, "from", metalq.__file__)
          qc = Circuit(3)
          qc.h(0); qc.cx(0, 1); qc.ry(0.3, 2); qc.cz(1, 2)
          gpu = MPSBackend().statevector(qc)
          cpu = CPUBackend().statevector(qc)
          diff = np.abs(np.asarray(gpu) - np.asarray(cpu)).max()
          print("max |MPS - CPU| =", diff)
          assert diff < 1e-5
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/metalq/
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
